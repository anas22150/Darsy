
name: Darsy Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Darsy ZIP
        shell: bash
        run: |
          python - <<'PY'
          import os
          import zipfile

          archive = "Darsy-main.zip"
          os.makedirs("extracted", exist_ok=True)

          if not os.path.exists(archive):
              raise SystemExit("Darsy-main.zip not found!")

          with zipfile.ZipFile(archive) as z:
              z.extractall("extracted")

          found = None

          for root, dirs, files in os.walk("extracted"):
              for file in files:
                  if file.lower().endswith(".zip"):
                      path = os.path.join(root, file)
                      try:
                          with zipfile.ZipFile(path) as z:
                              z.extractall(os.path.join(root, "inner"))
                      except zipfile.BadZipFile:
                          pass

          for root, dirs, files in os.walk("extracted"):
              if "main.py" in files:
                  found = root
                  break

          if not found:
              raise SystemExit("Could not find main.py in extracted project!")

          with open("project_path.txt", "w") as f:
              f.write(os.path.abspath(found))

          print("Project found:", found)
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.1.2
          pip install "qrcode[pil]" reportlab Pillow arabic-reshaper python-bidi

      - name: Build Android APK
        shell: bash
        run: |
          PROJECT=$(cat project_path.txt)
          cd "$PROJECT"
          flet build apk --verbose

      - name: Rename APK
        run: |
          mkdir -p final_apk
          find extracted -type f -name "*.apk" -exec cp {} final_apk/Darsy.apk \;
          test -f final_apk/Darsy.apk

      - name: Upload Darsy APK
        uses: actions/upload-artifact@v4
        with:
          name: Darsy-APK
          path: final_apk/Darsy.apk
          if-no-files-found: error
          
