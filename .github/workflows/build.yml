name: Build and Deploy THE LAST SURVIVOR

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare game files
        run: |
          mkdir -p public
          ZIP="THE-LAST-SURVIVOR-PROGRAM-ONLY.zip"
          if [ -f "$ZIP" ]; then
            unzip -o "$ZIP" -d public
          else
            cp index.html public/
            [ ! -f sw.js ] || cp sw.js public/
            [ ! -f manifest.webmanifest ] || cp manifest.webmanifest public/
            [ ! -f icon.svg ] || cp icon.svg public/
          fi
          touch public/.nojekyll
          test -f public/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        
